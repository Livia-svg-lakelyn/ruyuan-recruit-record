name: Publish v20 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v20.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Download verified v20 artifact
        run: |
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-6a50-8211-82a2-ba441590c780/raw?se=2026-09-09T17%3A15%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=3911ed54-23ff-5c82-a219-639a453c41f3&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T15%3A11%3A18Z&ske=2026-09-10T15%3A11%3A18Z&sks=b&skv=2026-02-06&sig=cRGpXkDVp7vO/MgByjnQWd/5m46WcAqSW92Enfgpix4%3D' -o v20-artifact.zip
          unzip -j v20-artifact.zip 'RuYuan-Recruit-Record-v20.apk' -d .
          test -s RuYuan-Recruit-Record-v20.apk

      - name: Replace old public APK
        run: |
          rm -f RuYuan-Recruit-Record-v15.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish RuYuan Recruit Record v20'
          git push
