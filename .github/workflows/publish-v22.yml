name: Publish v22 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v22.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Download verified v22 artifact
        run: |
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8ba0-81f5-a759-a962ec9c7721/raw?se=2026-09-10T02%3A28%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=1f0675b5-4270-539a-a49a-8ed7f782375f&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T19%3A56%3A22Z&ske=2026-09-10T19%3A56%3A22Z&sks=b&skv=2026-02-06&sig=7mHXNTAsa2COTGeFLFaXu1nCh2T9BvkB5jM%2Bhv1ZN%2B0%3D' -o v22-artifact.zip
          unzip -j v22-artifact.zip 'RuYuan-Recruit-Record-v22.apk' -d .
          test -s RuYuan-Recruit-Record-v22.apk

      - name: Replace public APK with v22
        run: |
          rm -f RuYuan-Recruit-Record-v21.apk
          rm -f v22-artifact.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish RuYuan Recruit Record v22'
          git push
