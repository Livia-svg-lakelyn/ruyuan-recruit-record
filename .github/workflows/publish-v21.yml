name: Publish v21 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v21.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Download verified v21 artifact
        run: |
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0844-81f5-b2cc-7806291610b7/raw?se=2026-09-10T02%3A22%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=3c1b3a1a-110f-5db6-bd2d-7a34f4ae8fe6&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T21%3A24%3A36Z&ske=2026-09-10T21%3A24%3A36Z&sks=b&skv=2026-02-06&sig=QYQ1j0KGb0UtZwpmG3nKa38yF/3RgL1i5Q%2BE35xTyTs%3D' -o v21-artifact.zip
          unzip -j v21-artifact.zip 'RuYuan-Recruit-Record-v21.apk' -d .
          test -s RuYuan-Recruit-Record-v21.apk

      - name: Replace public APK with v21
        run: |
          rm -f RuYuan-Recruit-Record-v20.apk
          rm -f v21-artifact.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish RuYuan Recruit Record v21'
          git push
